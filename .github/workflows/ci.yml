name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Test
        run: python -m pytest --doctest-modules src tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install ruff mypy -e .
      - name: Ruff
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Mypy
        run: mypy

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/translit-names "Щербаков Юрий"
          /tmp/wheel-env/bin/python -c "import translit_names as t; assert len(t.list_schemes()) > 50"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  js:
    name: TypeScript / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Parity fixtures are up to date with the Python implementation
        run: |
          python -m pip install -e .
          python scripts/gen_parity_fixtures.py
          git diff --exit-code js/test/fixtures/parity.json
      - name: Install
        working-directory: js
        run: npm ci
      - name: Typecheck
        working-directory: js
        run: npm run typecheck
      - name: Test (incl. parity with Python)
        working-directory: js
        run: npm test
      - name: Build and smoke-test the package
        working-directory: js
        run: |
          npm run build
          npm pack
          mkdir -p /tmp/consumer && cd /tmp/consumer && npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/js/translit-names-*.tgz
          node --input-type=module -e 'import { transliterate } from "translit-names"; if (transliterate("Щербаков Юрий") !== "Shcherbakov Iurii") process.exit(1)'
          node -e 'const { similarity } = require("translit-names"); if (!(similarity("Магомед", "Mehmet") > 0.9)) process.exit(1)'
